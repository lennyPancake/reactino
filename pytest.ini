[pytest]
# Путь к тестам
testpaths = tests/unit tests/integration tests/e2e

# Минимальная версия Python
minversion = 7.0

# Опции по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Маркеры
markers =
    unit: unit тесты
    integration: интеграционные тесты
    e2e: end-to-end тесты (Selenium)
    auth: тесты авторизации
    posts: тесты постов
    comments: тесты комментариев
    slow: медленные тесты
    skip: пропустить тест

# Игнорировать файлы
norecursedirs = .git .tox build dist *.egg __pycache__ .pytest_cache

# Python файлы для поиска тестов
python_files = test_*.py *_test.py

# Функции для поиска тестов
python_functions = test_

# Классы для поиска тестов
python_classes = Test* *Tests

# Timeout для тестов (в секундах)
timeout = 300
