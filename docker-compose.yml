services:
  db:
    image: postgres:16-alpine
    container_name: blog_db
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: SuperSecure123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blog_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --reload

  frontend:
    build: ./frontend
    container_name: blog_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - WDS_SOCKET_PORT=0 # Исправляет проблему с Hot Reload в Docker (для CRA)
      - CHOKIDAR_USEPOLLING=true # Чтобы изменения файлов подхватывались в Windows/Mac
    volumes:
      - ./frontend:/app
      - /app/node_modules # Чтобы локальные node_modules не затирали контейнерные
    depends_on:
      - backend
    stdin_open: true # Нужно для интерактивного режима npm start
    tty: true

volumes:
  postgres_data:
