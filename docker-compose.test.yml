services:
  db:
    image: postgres:16-alpine
    container_name: blog_db_test
    environment:
      POSTGRES_DB: blog_test
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: SuperSecure123
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_test"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: blog_backend_test
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env.test
    environment:
      - ENVIRONMENT=test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        echo '=== Waiting for database ===' &&
        sleep 8 &&
        echo '=== Running Alembic migrations ===' &&
        alembic upgrade head &&
        echo '=== Starting FastAPI ===' &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build: ./frontend
    container_name: blog_frontend_test
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
      - REACT_APP_BASE_URL=http://backend:8000
      - WDS_SOCKET_PORT=0
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium_chrome
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    depends_on:
      - frontend

  backend-unit-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.e2e
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - ./allure-results:/allure-results
    working_dir: /app
    command: pytest tests/unit/ -v --alluredir=/allure-results
    profiles:
      - test

  backend-integration-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.e2e
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./allure-results:/allure-results
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: pytest tests/integration/ -v --alluredir=/allure-results
    profiles:
      - test

  frontend-component-tests:
    build: ./frontend
    container_name: blog_frontend_component_tests
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm test -- --watchAll=false --coverage --testPathPattern=components
    profiles:
      - test

  e2e-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.e2e
    environment:
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
      - BASE_URL=http://frontend:3000
      - PYTHONPATH=/app
    volumes:
      - ./allure-results:/allure-results
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      selenium:
        condition: service_started
    command: >
      sh -c "
        echo '=== Waiting for all services to be fully ready ===' &&
        sleep 5 &&
        echo '=== Starting pytest ===' &&
        pytest tests/e2e/ -v --alluredir=/allure-results
      "
    profiles:
      - test

  allure:
    image: frankescobar/allure-docker-service:latest
    container_name: allure_test
    ports:
      - "5050:5050"
    volumes:
      - ./allure-results:/app/allure-results
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 5
      KEEP_HISTORY: 1
    profiles:
      - allure

volumes:
  postgres_test_data:
